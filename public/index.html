<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Kitel</title>
<style>
:root{
  --bg:#0b1020;--bg2:#121a33;--card:#18223f;--line:#26325a;
  --text:#eef2ff;--sub:#9aa6cc;--accent:#5ee6c8;--accent2:#7c8cff;--warn:#ffb85c;--bad:#ff6b8a;
  --me:#2b3a74;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  background:radial-gradient(120% 60% at 80% -10%,#24306a 0%,transparent 60%),radial-gradient(90% 50% at -10% 110%,#103a44 0%,transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer}
header{padding:calc(var(--safe-t) + 12px) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{position:relative;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 6px 20px #5ee6c833}
.logo svg{width:24px;height:24px}
#aiDot{position:absolute;right:-3px;bottom:-3px;font-size:13px;background:var(--bg);border-radius:50%;line-height:1;padding:1px}
.ttl b{font-size:19px;letter-spacing:.5px}
.ttl small{display:block;color:var(--sub);font-size:12px;margin-top:1px}
.hbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:12px;width:40px;height:40px;font-size:18px}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
#log{flex:1;overflow-y:auto;padding:8px 14px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;contain:content}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;line-height:1.5;font-size:15.5px;white-space:pre-wrap;word-break:break-word;animation:pop .2s ease}
.msg.bot{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px;align-self:flex-start}
.msg.bot.ai{border-color:#7c8cff88}
.msg.me{background:var(--me);border-top-right-radius:6px;align-self:flex-end}
.msg .t{display:block;font-size:11px;color:var(--sub);margin-top:4px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.typing{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#ffffff0d;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 13px;font-size:13.5px}
.inbar{display:flex;gap:6px;padding:8px 10px 10px;align-items:flex-end}
.inbar textarea{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:22px;padding:12px 15px;font-size:16px;outline:none;resize:none;height:48px;max-height:120px;line-height:1.4;font-family:inherit}
.inbar textarea:focus{border-color:var(--accent2)}
.send.stop{background:var(--bad);color:#fff;font-size:16px}
.mic.off{opacity:.45}
#preview{display:flex;align-items:center;gap:10px;margin:0 12px 2px;padding:8px;background:var(--card);border:1px solid var(--accent2);border-radius:14px;font-size:13px;color:var(--sub)}
#preview[hidden]{display:none}
#preview img{width:48px;height:48px;object-fit:cover;border-radius:10px;flex:none}
#preview span{flex:1}
#preview button{background:none;border:0;color:var(--sub);font-size:22px;width:32px}
#aiBanner{margin:4px 14px 6px;padding:11px 14px;border-radius:14px;background:#ffb85c1f;border:1px solid #ffb85c88;color:#ffd9a6;font-size:13.5px;line-height:1.45;text-align:left;width:calc(100% - 28px)}
#aiBanner b{color:#ffe7c4}
#aiBanner[hidden]{display:none}
.msg .body b.h{display:inline-block;font-size:16.5px;margin:2px 0}
.msg .body code{background:#0b1020;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:13.5px;font-family:ui-monospace,Menlo,monospace}
.msg .body pre{background:#0b1020;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:6px 0;white-space:pre}
.msg .body pre code{border:0;padding:0;background:none}
.msg .body a{color:var(--accent)}
.msg.streaming .body:after{content:"▍";color:var(--accent);animation:bl .9s infinite;margin-left:1px}
.msg.streaming .body:empty:after{content:"생각 중…";color:var(--sub);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts:empty{display:none}
.acts{margin-top:8px}
.act{background:#5ee6c81a;border:1px solid #5ee6c855;color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12.5px;animation:pop .25s ease}
.src{margin-top:8px;font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px}
.src a{color:var(--accent2);text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .pic{display:block;max-width:220px;max-height:260px;border-radius:12px;margin-bottom:6px}
.picph{font-size:13px;color:var(--sub);margin-bottom:4px}
#factList .item{padding:10px 12px}
#factList .txt{font-size:14px}
.sheetSec{color:var(--sub);font-size:13px;font-weight:700;margin:14px 4px 8px}
.send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020;font-size:20px;font-weight:700;flex:none}
.mic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:19px;flex:none}
.mic.rec{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff6b8a88}50%{box-shadow:0 0 0 10px #ff6b8a00}}
.pane{flex:1;overflow-y:auto;padding:6px 14px 20px;-webkit-overflow-scrolling:touch}
.addbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.addbox .row{display:flex;gap:8px}
.addbox input,.addbox select{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;color-scheme:dark;font-family:inherit}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020}
.hint{color:var(--sub);font-size:12px;margin:-2px 2px 0}
.sec{color:var(--sub);font-size:13px;font-weight:700;margin:16px 4px 8px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--accent);flex:none;display:grid;place-items:center;color:#0b1020;font-weight:900;font-size:15px;background:transparent;padding:0}
.item.done .chk{background:var(--accent)}
.item.done .txt{text-decoration:line-through;color:var(--sub)}
.txt{flex:1;min-width:0;font-size:15.5px;line-height:1.35}
.txt small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.txt small.late{color:var(--bad)}
.star{background:none;border:0;color:#3a4675;font-size:19px;width:30px;height:34px;flex:none;padding:0}
.star.on{color:#ffd166}
.del{background:none;border:0;color:var(--sub);font-size:20px;width:30px;height:34px;flex:none;padding:0}
.time{flex:none;min-width:62px;text-align:center;background:var(--bg2);border-radius:10px;padding:7px 4px;font-weight:800;font-size:13.5px;color:var(--accent)}
.time.past{color:var(--sub);opacity:.6}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14.5px;line-height:1.6}
#strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.day{flex:none;width:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 0 6px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px}
.day small{font-size:11px;color:var(--sub)}
.day b{font-size:16px}
.day span{font-size:13px}
.day.sun small{color:#ff8fa3}.day.sat small{color:#8fb3ff}
.day.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1020;border-color:transparent}
.day.on small{color:#0b1020}
.dot,.nodot{width:5px;height:5px;border-radius:50%}
.dot{background:var(--accent)}.day.on .dot{background:#0b1020}
nav{display:flex;border-top:1px solid var(--line);background:#0b1020ee;padding-bottom:var(--safe-b);backdrop-filter:blur(10px)}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:10px 0 9px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button span{font-size:21px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--text)}
nav button.on span{filter:none;opacity:1}
nav .badge{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 6px;font-style:normal}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-160%);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:12px 16px;border-radius:16px;font-size:14.5px;z-index:9;transition:transform .3s;max-width:90%;box-shadow:0 10px 30px #0008}
#toast.on{transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:8}
#sheet.on{display:flex}
#sheet .box{background:var(--bg2);width:100%;max-height:88dvh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));border-top:1px solid var(--line)}
#sheet h3{margin:0 0 12px;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
#sheet h3 small{color:var(--sub);font-weight:400;font-size:12px}
#sheet .opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:14px;font-size:15px;margin-bottom:8px}
#sheet .opt.red{color:var(--bad)}
#aiStatus{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:14px;color:var(--sub);margin-bottom:8px;line-height:1.45;white-space:pre-line}
#aiStatus.on{border-color:var(--accent);color:var(--text)}
@media (min-width:720px){body{max-width:720px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 7-7 9-7-9 7-7z" fill="#0b1020"/><path d="M12 18c0 2 -2 3 -3 4M12 18c1 1 3 1 3 3" stroke="#0b1020" stroke-width="1.6" stroke-linecap="round"/></svg><span id="aiDot" hidden>✨</span></div>
  <div class="ttl"><b>Kitel</b><small id="sub">맡기면 날아가서 해결해요</small></div>
  <button class="hbtn" id="menuBtn" aria-label="메뉴">⋯</button>
</header>

<main>
  <section class="view on" id="v-chat">
    <button id="aiBanner" hidden>⚠️ 지금은 <b>기본 모드</b>라 정해진 말만 알아들어요. <b>여기를 눌러 AI 켜는 법 보기 →</b></button>
    <div id="log" aria-live="polite"></div>
    <div id="chips"></div>
    <div id="preview" hidden></div>
    <div class="inbar">
      <button class="mic" id="camBtn" aria-label="사진 보내기">📷</button>
      <input type="file" id="camFile" accept="image/*" hidden>
      <button class="mic" id="micBtn" aria-label="말로 하기">🎤</button>
      <textarea id="in" rows="1" placeholder="Kitel에게 말하기…" autocomplete="off" enterkeyhint="send"></textarea>
      <button class="send" id="sendBtn" aria-label="보내기">↑</button>
    </div>
  </section>

  <section class="view" id="v-todo">
    <div class="pane">
      <div class="addbox">
        <div class="row">
          <input id="todoIn" placeholder="할 일 (예: 중요한 보고서 금요일까지)" enterkeyhint="done">
          <button class="btn" id="todoAdd">추가</button>
        </div>
        <div class="hint">"금요일까지"처럼 쓰면 기한이, "중요"를 넣으면 ⭐가 붙어요</div>
      </div>
      <div id="todoList"></div>
    </div>
  </section>

  <section class="view" id="v-cal">
    <div class="pane">
      <div class="addbox">
        <input id="evTitle" placeholder="일정 이름 (예: 치과)">
        <div class="row">
          <input id="evDate" type="date">
          <input id="evTime" type="time">
        </div>
        <div class="row">
          <select id="evRep" aria-label="반복">
            <option value="">반복 없음</option>
            <option value="daily">매일</option>
            <option value="weekdays">평일마다</option>
            <option value="weekly">매주</option>
            <option value="monthly">매달</option>
          </select>
          <button class="btn" id="evAdd">일정 추가</button>
        </div>
      </div>
      <div id="strip"></div>
      <div id="evList"></div>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-v="chat"><span>💬</span>대화</button>
  <button data-v="todo"><span>✅</span>할 일<em class="badge" id="todoBadge" hidden></em></button>
  <button data-v="cal"><span>📅</span>일정<em class="badge" id="calBadge" hidden></em></button>
</nav>

<div id="toast" role="status"></div>
<div id="sheet"><div class="box">
  <h3>Kitel 설정 <small>v4.0</small></h3>
  <div id="aiStatus">✨ AI 연결 확인 중…</div>
  <div class="sheetSec">💡 Kitel이 기억하는 것</div>
  <div id="factList"></div>
  <div class="sheetSec">설정</div>
  <button class="opt" id="optTts">🔈 답변 읽어주기</button>
  <button class="opt" id="optNotif">🔔 알림 켜기</button>
  <button class="opt" id="optExport">💾 데이터 백업 저장</button>
  <button class="opt" id="optImport">📥 백업 불러오기</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <button class="opt" id="optClearChat">🧹 대화 기록 지우기</button>
  <button class="opt" id="optClearDone">✅ 완료한 할 일 정리</button>
  <button class="opt red" id="optReset">⚠️ 모든 데이터 초기화</button>
  <button class="opt" id="optClose">닫기</button>
</div></div>

<script src="app.js?v=4"></script>
</body>
</html>
